# files under these patterns are skipped by depcheck.
# .agent/ holds symlinked third-party role skills (rhachet roles), not this repo's
# source — their imports (playwright, declastruct-*, etc.) are the roles' own deps, so
# they must not count against this repo's dependency surface. (materialized locally by
# `prepare:rhachet`, which CI skips, so this only bites local runs.)
ignore-patterns:
  - .agent

ignores:
  - depcheck
  - declapract
  - declapract-typescript-ehmpathy
  - '@commitlint/config-conventional'
  - husky
  - if-env
  - "@src/*"
  - "@src/.*"
  - rhachet
  - rhachet-brains-anthropic
  - rhachet-brains-fireworksai
  - rhachet-brains-xai
  - rhachet-brains-fireworksai
  - rhachet-roles-bhrain
  - rhachet-roles-bhrowser
  - rhachet-roles-bhuild
  - rhachet-roles-ehmpathy
  - rhachet-roles-ghlitch
  - rhachet-roles-rhachet
  - "@tsconfig/node20"
  - "@tsconfig/strictest"
  - "@tsconfig/node-lts-strictest"
  - "@biomejs/biome"
  - esbuild-register
  - "@swc/core"
  - "@swc/jest"
  - tsx
  - tsc-alias
  - yalc
  - core-js
  - test-fns
  - ts-jest
  - ts-node
  - "@ehmpathy/error-fns"
